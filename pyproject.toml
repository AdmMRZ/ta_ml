[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-ml"
version = "0.1.0"
description = "Reproducible cleaning, feature engineering, and evaluation for tower lightning counts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5,<6",
]

[project.scripts]
ta-ml = "ta_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
